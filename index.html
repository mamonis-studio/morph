<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MORPH - 一括画像変換ツール | Batch Image Converter</title>
<meta name="description" content="ブラウザで完結する一括画像フォーマット変換。HEIC対応、制限なし、アップロード不要。Privacy-first batch image converter.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0a0a0b;--bg1:#111113;--bg2:#141416;--border:#1a1a1e;--border2:#2a2a2e;--green:#00ff88;--green-dim:rgba(0,255,136,0.06);--green-glow:rgba(0,255,136,0.08);--green-faint:#00ff8844;--red:#ff4444;--yellow:#ffaa00;--text:#e8e8e8;--text2:#ccc;--text3:#888;--text4:#555;--text5:#333;--text6:#2a2a2e;--mono:'JetBrains Mono','SF Mono','Fira Code',monospace;--heading:'Space Grotesk',sans-serif;--jp:'Noto Sans JP',sans-serif}
html{background:var(--bg);color:var(--text);font-family:var(--mono)}
body{min-height:100vh}
::-webkit-scrollbar{width:6px}::-webkit-scrollbar-track{background:var(--bg2)}::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}

.wrap{max-width:880px;margin:0 auto;padding:40px 20px}

/* Header */
.header{margin-bottom:40px}
.header-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.header-left{display:flex;align-items:baseline;gap:12px}
.logo{font-size:36px;font-weight:700;letter-spacing:-1px;color:#fff;font-family:var(--heading)}
.subtitle{font-size:11px;color:var(--green);letter-spacing:2px;font-weight:500;text-transform:uppercase}
.tagline{font-size:13px;color:var(--text4);line-height:1.6}
.heic-status{margin-left:8px;font-family:var(--mono)}

/* Lang switch */
.lang-group{display:flex;gap:4px}
.lang-btn{background:none;border:1px solid var(--border2);border-radius:6px;padding:4px 10px;font-family:var(--heading);font-size:12px;font-weight:500;cursor:pointer;transition:all .2s;color:var(--text4);letter-spacing:.5px}
.lang-btn:hover{border-color:var(--text4);color:#aaa}
.lang-btn.active{border-color:var(--green);color:var(--green);background:rgba(0,255,136,.04)}

/* Drop zone */
.dz{border:2px dashed var(--border2);border-radius:12px;padding:48px 24px;text-align:center;cursor:pointer;transition:all .25s;background:var(--bg1);position:relative;overflow:hidden}
.dz::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at center,rgba(0,255,136,.03) 0%,transparent 70%);pointer-events:none}
.dz:hover,.dz.on{border-color:var(--green);background:#0d120e}
.dz.on{box-shadow:0 0 40px var(--green-glow)}
.dz-icon{color:var(--text4);margin-bottom:12px;transition:color .2s;display:flex;justify-content:center}
.dz.on .dz-icon,.dz:hover .dz-icon{color:var(--green)}
.dz-title{font-size:14px;color:var(--text4);font-weight:500;margin-bottom:6px;transition:color .2s}
.dz.on .dz-title{color:var(--green)}
.dz-formats{font-size:11px;color:var(--text5)}
#file-input{display:none}

/* Controls area */
.controls{margin-top:28px}
.section-label{font-size:11px;color:var(--text4);margin-bottom:8px;letter-spacing:1px;text-transform:uppercase}

/* Format buttons */
.fmt-row{display:flex;gap:6px}
.fmt-btn{padding:8px 16px;border:1px solid var(--border2);border-radius:6px;background:var(--bg2);color:var(--text3);cursor:pointer;font-family:var(--mono);font-size:13px;font-weight:500;transition:all .2s;letter-spacing:.5px}
.fmt-btn:hover{border-color:#444;color:var(--text2)}
.fmt-btn.on{border-color:var(--green);color:var(--green);background:var(--green-dim);box-shadow:0 0 12px var(--green-glow)}

/* Quality slider */
.quality-wrap{min-width:200px}
.slider{-webkit-appearance:none;width:100%;height:4px;border-radius:2px;background:var(--border2);outline:none}
.slider::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:var(--green);cursor:pointer;box-shadow:0 0 8px rgba(0,255,136,.3)}
.slider-labels{display:flex;justify-content:space-between;font-size:10px;color:var(--text5);margin-top:4px}

/* Settings button */
.gear-btn{background:none;border:1px solid var(--border2);color:var(--text4);padding:6px 12px;border-radius:6px;font-family:var(--mono);font-size:12px;cursor:pointer;transition:all .15s;display:inline-flex;align-items:center;gap:6px}
.gear-btn:hover{border-color:var(--green);color:var(--green)}
.gear-btn.on{border-color:var(--green);color:var(--green);background:var(--green-dim)}

/* Settings panel */
.sp{background:var(--bg1);border:1px solid var(--border);border-radius:10px;padding:20px;margin-bottom:20px;display:none}
.sp.open{display:block}
.setting-row{display:flex;align-items:center;gap:12px}
.setting-row+.setting-row{margin-top:18px}
.setting-title{font-size:13px;color:var(--text2);font-weight:500}
.setting-desc{font-size:11px;color:#444}

/* Toggle */
.tg{position:relative;width:38px;height:20px;border-radius:10px;background:var(--border2);cursor:pointer;transition:background .2s;border:none;flex-shrink:0}
.tg.on{background:var(--green)}
.tg::after{content:'';position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--bg);transition:transform .2s}
.tg.on::after{transform:translateX(18px)}

/* Num input */
.ni{width:90px;padding:6px 10px;background:var(--bg);border:1px solid var(--border2);border-radius:6px;color:var(--text2);font-family:var(--mono);font-size:13px;outline:none;transition:border-color .2s}
.ni:focus{border-color:var(--green)}
.ni::placeholder{color:var(--text5)}
.resize-fields{display:flex;align-items:center;gap:10px;margin-left:50px;margin-top:10px;flex-wrap:wrap}

/* File list */
.file-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.file-count{font-size:12px;color:var(--text4)}
.clear-btn{background:none;border:1px solid var(--border2);color:var(--text4);padding:6px 12px;border-radius:6px;font-family:var(--mono);font-size:12px;cursor:pointer;transition:all .15s}
.clear-btn:hover{border-color:var(--red);color:var(--red)}

.file-list{display:flex;flex-direction:column;gap:6px;margin-bottom:24px;max-height:400px;overflow-y:auto;padding-right:4px}

.fr{display:grid;grid-template-columns:44px 1fr 72px 20px 72px 100px 32px;align-items:center;gap:10px;padding:10px 14px;background:var(--bg1);border-radius:8px;border:1px solid var(--border);transition:all .2s;animation:si .25s ease forwards}
.fr:hover{border-color:var(--border2);background:var(--bg2)}

.thumb{width:40px;height:40px;border-radius:4px;overflow:hidden;background:#1a1a1e;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.thumb img{width:100%;height:100%;object-fit:cover}
.fname{font-size:13px;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fdims{font-size:10px;color:var(--text5)}
.fsize{font-size:11px;color:var(--text4);text-align:right}
.farrow{display:flex;justify-content:center;color:var(--border2)}
.farrow.done{color:var(--green)}
.fout{font-size:11px;color:var(--text5);text-align:right}
.fout.done{color:var(--green)}

/* Badges */
.bd{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:4px;font-size:11px;font-weight:500;letter-spacing:.3px}
.bd.pe{background:#1a1a2e;color:#666}
.bd.co{background:#1a1a0e;color:var(--yellow);animation:pu 1.5s ease-in-out infinite}
.bd.er{background:#1a0e0e;color:var(--red)}

.rm-btn{background:none;border:none;color:#444;cursor:pointer;padding:4px;border-radius:4px;display:flex;align-items:center;justify-content:center;transition:all .15s}
.rm-btn:hover{color:var(--red);background:rgba(255,68,68,.1)}

.dl-btn{background:none;border:1px solid var(--border2);color:var(--green);cursor:pointer;padding:4px 10px;border-radius:4px;display:inline-flex;align-items:center;gap:4px;font-family:var(--mono);font-size:11px;transition:all .15s}
.dl-btn:hover{border-color:var(--green);background:var(--green-dim)}

/* Stats */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:24px}
.sc{background:var(--bg1);border:1px solid var(--border);border-radius:8px;padding:16px;text-align:center}
.sc-val{font-size:22px;font-weight:700;font-family:var(--heading)}
.sc-label{font-size:10px;color:var(--text4);letter-spacing:1px;margin-top:4px}

/* Action buttons */
.actions{display:flex;gap:10px}
.ab{flex:1;padding:16px;border:none;border-radius:10px;font-family:var(--mono);font-size:15px;font-weight:600;letter-spacing:1px;cursor:pointer;transition:all .25s;display:flex;align-items:center;justify-content:center;gap:10px;text-transform:uppercase}
.ab.p{background:var(--green);color:var(--bg);flex:2}
.ab.p:hover{background:#33ffaa;box-shadow:0 0 30px rgba(0,255,136,.2);transform:translateY(-1px)}
.ab.p:disabled{opacity:.3;cursor:not-allowed;transform:none;box-shadow:none}
.ab.s{background:transparent;color:var(--green);border:1px solid var(--green)}
.ab.s:hover{background:var(--green-dim)}
.ab.s:disabled{opacity:.3;cursor:not-allowed}

/* Feature cards */
.features{margin-top:48px;display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.feat{padding:20px 16px;background:var(--bg1);border:1px solid var(--border);border-radius:8px}
.feat-title{font-size:12px;font-weight:600;color:var(--green);letter-spacing:1px;margin-bottom:6px;font-family:var(--heading)}
.feat-desc{font-size:12px;color:#444;line-height:1.5}

.footer{margin-top:48px;padding-top:20px;border-top:1px solid var(--bg2);font-size:11px;color:var(--text6);text-align:center;letter-spacing:.5px}

@keyframes pu{0%,100%{opacity:1}50%{opacity:.4}}
@keyframes si{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

/* JP body text */
.jp{font-family:var(--jp),var(--mono),sans-serif}

@media(max-width:640px){
  .fr{grid-template-columns:40px 1fr 60px 16px 60px 80px 28px;gap:6px;padding:8px 10px;font-size:12px}
  .features{grid-template-columns:1fr}
  .stats{grid-template-columns:1fr}
  .header-top{flex-direction:column;align-items:flex-start;gap:10px}
  .lang-group{align-self:flex-end;margin-top:-28px}
  .resize-fields{margin-left:0}
}
</style>
</head>
<body>

<div class="wrap">
  <!-- Header -->
  <div class="header">
    <div class="header-top">
      <div class="header-left">
        <h1 class="logo">MORPH</h1>
        <span class="subtitle" id="subtitle"></span>
      </div>
      <div class="lang-group">
        <button class="lang-btn active" data-lang="ja" onclick="setLang('ja')">JA</button>
        <button class="lang-btn" data-lang="en" onclick="setLang('en')">EN</button>
      </div>
    </div>
    <p class="tagline" id="tagline"></p>
  </div>

  <!-- Drop Zone -->
  <div class="dz" id="drop-zone" onclick="document.getElementById('file-input').click()">
    <input type="file" id="file-input" accept="image/jpeg,image/png,image/webp,image/gif,image/bmp,image/tiff,image/svg+xml,image/avif,image/heic,image/heif,.heic,.heif" multiple>
    <div class="dz-icon">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
    </div>
    <div class="dz-title" id="dz-title"></div>
    <div class="dz-formats">JPEG / PNG / WebP / AVIF / GIF / BMP / TIFF / SVG / HEIC</div>

  <!-- Controls (hidden until files added) -->
  <div class="controls" id="controls" style="display:none">

    <!-- Format + Quality row -->
    <div style="display:flex;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;gap:20px;margin-bottom:20px">
      <div>
        <div class="section-label" id="lbl-format"></div>
        <div class="fmt-row" id="fmt-row"></div>
      </div>
      <div class="quality-wrap" id="quality-wrap">
        <div class="section-label" id="lbl-quality"></div>
        <input type="range" class="slider" id="quality-slider" min="1" max="100" value="85">
        <div class="slider-labels"><span id="lbl-min"></span><span id="lbl-max"></span></div>
      </div>
    </div>

    <!-- Settings toggle -->
    <div style="margin-bottom:16px">
      <button class="gear-btn" id="gear-btn" onclick="toggleSettings()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        <span id="lbl-settings"></span>
      </button>
    </div>

    <!-- Settings panel -->
    <div class="sp" id="settings-panel">
      <!-- Resize -->
      <div class="setting-row">
        <button class="tg" id="tg-resize" onclick="toggleResize()"></button>
        <div>
          <div class="setting-title" id="lbl-resize"></div>
          <div class="setting-desc" id="lbl-resize-desc"></div>
        </div>
      </div>
      <div class="resize-fields" id="resize-fields" style="display:none">
        <input class="ni" type="number" id="resize-w" placeholder="" min="1" max="99999">
        <span style="color:var(--text5)">x</span>
        <input class="ni" type="number" id="resize-h" placeholder="" min="1" max="99999">
        <span style="color:var(--text5);font-size:12px">px</span>
        <div style="display:flex;align-items:center;gap:6px;margin-left:12px">
          <button class="tg on" id="tg-lock" onclick="toggleLock()"></button>
          <span style="font-size:11px;color:var(--green)" id="lbl-lock"></span>
        </div>
      </div>
      <!-- Metadata -->
      <div class="setting-row" style="margin-top:18px">
        <button class="tg on" id="tg-strip" onclick="toggleStrip()"></button>
        <div>
          <div style="display:flex;align-items:center;gap:6px">
            <span class="setting-title" id="lbl-strip"></span>
            <svg id="shield-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--green)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
          </div>
          <div class="setting-desc" id="lbl-strip-desc"></div>
        </div>
      </div>
    </div>

    <!-- File list header -->
    <div class="file-header">
      <span class="file-count" id="file-count"></span>
      <button class="clear-btn" id="clear-btn" onclick="clearAll()"></button>
    </div>

    <!-- File list -->
    <div class="file-list" id="file-list"></div>

    <!-- Stats -->
    <div class="stats" id="stats-row" style="display:none">
      <div class="sc"><div class="sc-val" style="color:var(--green)" id="stat-count"></div><div class="sc-label" id="stat-count-lbl"></div></div>
      <div class="sc"><div class="sc-val" id="stat-diff"></div><div class="sc-label" id="stat-diff-lbl"></div></div>
      <div class="sc"><div class="sc-val" style="color:#fff" id="stat-fmt"></div><div class="sc-label" id="stat-fmt-lbl"></div></div>
    </div>

    <!-- Actions -->
    <div class="actions" id="actions"></div>
  </div>

  <!-- Features (empty state) -->
  <div class="features" id="features"></div>

  <!-- Footer -->
  <div class="footer" id="footer-text"></div>
</div>

<script>

const I = {
  ja: {

const SVG_ARROW = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>';

const SVG_CHECK = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>';
const SVG_ZIP = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>';
const SVG_IMG = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>';

// ── Helpers ──
function formatBytes(b) {
  if (b === 0) return "0 B";
  const k = 1024, s = ["B","KB","MB","GB"];
  const i = Math.floor(Math.log(b) / Math.log(k));
  return parseFloat((b / Math.pow(k, i)).toFixed(1)) + " " + s[i];
}
function getExt(name) { return name.split(".").pop().toLowerCase(); }
function isHeic(file) {
  const e = getExt(file.name);
  return e === "heic" || e === "heif" || file.type === "image/heic" || file.type === "image/heif";
}
function fmtInfo() { return FORMATS.find(f => f.value === outputFormat); }
function hasQuality() { return ["image/jpeg","image/webp","image/avif"].includes(outputFormat); }
function uid() { return crypto.randomUUID(); }

// ── Load external libs ──
function loadScript(src, key, check) {
  if (check()) { libsReady[key] = true; updateHeicStatus(); return; }
  const s = document.createElement("script");
  s.src = src;
  s.onload = () => { libsReady[key] = true; updateHeicStatus(); };
  s.onerror = () => console.warn(key + " failed");
  document.head.appendChild(s);
}

function updateHeicStatus() {
  const span = document.getElementById("heic-span");
  if (span) {
    span.style.color = libsReady.heic ? "var(--green-faint)" : "var(--yellow)";
    span.textContent = "/ " + (libsReady.heic ? t.heicReady : t.heicLoading);
  }
}

// ── i18n render ──
function setLang(l) {
  lang = l; t = I[l];
  document.querySelectorAll(".lang-btn").forEach(b => b.classList.toggle("active", b.dataset.lang === l));
  document.documentElement.lang = l;
  renderUI();
}

function renderUI() {
  const jp = lang === "ja";
  const jc = jp ? " jp" : "";

  document.getElementById("subtitle").textContent = t.subtitle;
  const tagEl = document.getElementById("tagline");
  tagEl.className = "tagline" + jc;
  tagEl.innerHTML = t.tagline + '<span class="heic-status" id="heic-span" style="color:' + (libsReady.heic ? "var(--green-faint)" : "var(--yellow)") + '">/ ' + (libsReady.heic ? t.heicReady : t.heicLoading) + '</span>';

  const dzTitle = document.getElementById("dz-title");
  dzTitle.className = "dz-title" + jc;
  dzTitle.textContent = t.dropTitle;

  document.getElementById("lbl-format").textContent = t.outputFormat;
  document.getElementById("lbl-quality").textContent = t.quality + ": " + quality + "%";
  document.getElementById("lbl-min").textContent = t.min;
  document.getElementById("lbl-max").textContent = t.max;
  document.getElementById("lbl-settings").textContent = t.settings;
  document.getElementById("lbl-resize").textContent = t.resize;
  document.getElementById("lbl-resize-desc").textContent = t.resizeDesc;
  document.getElementById("resize-w").placeholder = t.width;
  document.getElementById("resize-h").placeholder = t.height;
  document.getElementById("lbl-lock").textContent = t.lockRatio;
  document.getElementById("lbl-strip").textContent = t.stripMeta;
  document.getElementById("lbl-strip-desc").textContent = stripMeta ? t.stripOn : t.stripOff;
  document.getElementById("clear-btn").textContent = t.clearAll;
  document.getElementById("clear-btn").className = "clear-btn" + jc;
  document.getElementById("footer-text").className = "footer" + jc;
  document.getElementById("footer-text").textContent = t.footer;

  document.getElementById("quality-wrap").style.display = hasQuality() ? "" : "none";

  renderFormatBtns();
  renderFeatures();
  renderFileCount();
  renderStats();
  renderActions();
}

function renderFormatBtns() {
  const row = document.getElementById("fmt-row");
  row.innerHTML = FORMATS.map(f =>
    `<button class="fmt-btn${outputFormat === f.value ? " on" : ""}" onclick="setFormat('${f.value}')">${f.label}</button>`
  ).join("");
}

function setFormat(v) {
  outputFormat = v;
  renderUI();
}

function renderFeatures() {
  const el = document.getElementById("features");
  if (files.length > 0) { el.style.display = "none"; return; }
  el.style.display = "";
  const jp = lang === "ja";
  const feats = [
    { t: t.feat1t, d: t.feat1d },
    { t: t.feat2t, d: t.feat2d },
    { t: t.feat3t, d: t.feat3d },
  ];
  el.innerHTML = feats.map(f =>
    `<div class="feat"><div class="feat-title">${f.t}</div><div class="feat-desc${jp ? " jp" : ""}">${f.d}</div></div>`
  ).join("");
}

// ── Settings toggles ──
function toggleSettings() {
  const p = document.getElementById("settings-panel");
  const b = document.getElementById("gear-btn");
  const open = p.classList.toggle("open");
  b.classList.toggle("on", open);
}

function toggleResize() {
  resizeEnabled = !resizeEnabled;
  document.getElementById("tg-resize").classList.toggle("on", resizeEnabled);
  document.getElementById("resize-fields").style.display = resizeEnabled ? "flex" : "none";
}

function toggleLock() {
  lockAspect = !lockAspect;
  const tg = document.getElementById("tg-lock");
  tg.classList.toggle("on", lockAspect);
  document.getElementById("lbl-lock").style.color = lockAspect ? "var(--green)" : "var(--text4)";
}

function toggleStrip() {
  stripMeta = !stripMeta;
  document.getElementById("tg-strip").classList.toggle("on", stripMeta);
  document.getElementById("lbl-strip-desc").textContent = stripMeta ? t.stripOn : t.stripOff;
  document.getElementById("shield-icon").style.stroke = stripMeta ? "var(--green)" : "var(--text4)";
}

// ── File handling ──
async function createThumbnail(file) {
  try {
    let b = file;
    if (isHeic(file) && window.heic2any) b = await heic2any({ blob: file, toType: "image/jpeg", quality: 0.5 });
    const url = URL.createObjectURL(b);
    return await new Promise(res => {
      const img = new Image();
      img.onload = () => {
        const c = document.createElement("canvas"), sz = 80, r = Math.min(sz / img.width, sz / img.height);
        c.width = img.width * r; c.height = img.height * r;
        c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
        URL.revokeObjectURL(url); res(c.toDataURL("image/jpeg", 0.6));
      };
      img.onerror = () => { URL.revokeObjectURL(url); res(null); };
      img.src = url;
    });
  } catch { return null; }
}

async function getDims(file) {
  try {
    let b = file;
    if (isHeic(file) && window.heic2any) b = await heic2any({ blob: file, toType: "image/jpeg", quality: 0.3 });
    const url = URL.createObjectURL(b);
    return await new Promise(res => {
      const img = new Image();
      img.onload = () => { URL.revokeObjectURL(url); res({ w: img.naturalWidth, h: img.naturalHeight }); };
      img.onerror = () => { URL.revokeObjectURL(url); res(null); };
      img.src = url;
    });
  } catch { return null; }
}

async function addFiles(newFiles) {
  for (const file of newFiles) {
    const id = uid();
    const thumb = await createThumbnail(file);
    const dims = await getDims(file);
    files.push({ id, file, name: file.name, size: file.size, thumbnail: thumb, dims, status: "pending", output: null, outputBlob: null, outputSize: null, error: null });
  }
  document.getElementById("controls").style.display = "";
  renderUI();
  renderFileList();
}

function removeFile(id) {
  const f = files.find(x => x.id === id);
  if (f?.output) URL.revokeObjectURL(f.output);
  files = files.filter(x => x.id !== id);
  if (files.length === 0) document.getElementById("controls").style.display = "none";
  renderUI();
  renderFileList();
}

function clearAll() {
  files.forEach(f => { if (f.output) URL.revokeObjectURL(f.output); });
  files = [];
  document.getElementById("controls").style.display = "none";
  renderUI();
  renderFileList();
}

function renderFileCount() {
  const dc = files.filter(f => f.status === "done").length;
  const ec = files.filter(f => f.status === "error").length;
  const jp = lang === "ja";
  let html = files.length + " " + t.files;
  if (dc > 0) html += ` <span style="color:var(--green)">/ ${dc} ${t.done}</span>`;
  if (ec > 0) html += ` <span style="color:var(--red)">/ ${ec} ${t.failed}</span>`;
  const el = document.getElementById("file-count");
  el.innerHTML = html;
  el.className = "file-count" + (jp ? " jp" : "");
}

function renderFileList() {
  const el = document.getElementById("file-list");
  const fi = fmtInfo();
  el.innerHTML = files.map(f => {
    const thumbHtml = f.thumbnail
      ? `<img src="${f.thumbnail}" alt="">`
      : `<span style="color:var(--text5)">${SVG_IMG}</span>`;
    const dimsHtml = f.dims ? `<div class="fdims">${f.dims.w} x ${f.dims.h}</div>` : "";
    const isDone = f.status === "done";

    let statusHtml = "";
    if (f.status === "pending") statusHtml = `<span class="bd pe">${t.ready}</span>`;
    else if (f.status === "converting") statusHtml = `<span class="bd co">${t.converting}</span>`;
    else if (f.status === "done") statusHtml = `<button class="dl-btn" onclick="downloadFile('${f.id}')">${SVG_DL} .${fi.ext}</button>`;
    else if (f.status === "error") statusHtml = `<span class="bd er" title="${f.error || ''}">${t.error}</span>`;

    return `<div class="fr">
      <div class="thumb">${thumbHtml}</div>
      <div style="overflow:hidden"><div class="fname">${f.name}</div>${dimsHtml}</div>
      <div class="fsize">${formatBytes(f.size)}</div>
      <div class="farrow${isDone ? " done" : ""}">${SVG_ARROW}</div>
      <div class="fout${isDone ? " done" : ""}">${isDone ? formatBytes(f.outputSize) : "---"}</div>
      <div style="display:flex;justify-content:flex-end">${statusHtml}</div>
      <button class="rm-btn" onclick="removeFile('${f.id}')">${SVG_X}</button>
    </div>`;
  }).join("");
  renderFileCount();
  renderStats();
  renderActions();
}

function renderStats() {
  const dc = files.filter(f => f.status === "done").length;
  const row = document.getElementById("stats-row");
  if (dc === 0) { row.style.display = "none"; return; }
  row.style.display = "";
  const totalOrig = files.filter(f => f.status === "done").reduce((a, f) => a + f.size, 0);
  const totalOut = files.filter(f => f.status === "done").reduce((a, f) => a + (f.outputSize || 0), 0);
  const saved = totalOrig - totalOut;
  const fi = fmtInfo();

  document.getElementById("stat-count").textContent = dc + "/" + files.length;
  document.getElementById("stat-count-lbl").textContent = t.converted;

  const diffEl = document.getElementById("stat-diff");
  diffEl.textContent = (saved > 0 ? "-" : saved < 0 ? "+" : "") + formatBytes(Math.abs(saved));
  diffEl.style.color = saved > 0 ? "var(--green)" : saved < 0 ? "var(--red)" : "var(--text3)";
  document.getElementById("stat-diff-lbl").textContent = saved > 0 ? t.saved : saved < 0 ? t.larger : t.same;

  document.getElementById("stat-fmt").textContent = fi.label;
  document.getElementById("stat-fmt-lbl").textContent = t.output;
}

function renderActions() {
  const el = document.getElementById("actions");
  const dc = files.filter(f => f.status === "done").length;
  const pc = files.filter(f => f.status === "pending" || f.status === "converting").length;
  const fi = fmtInfo();
  const jp = lang === "ja";
  let html = "";

  if (converting) {
    html += `<button class="ab p" disabled style="flex:2"><span style="animation:pu 1.5s ease-in-out infinite">${t.converting}...</span></button>`;
  } else if (dc > 0 && pc === 0) {
    html += `<button class="ab p" disabled style="flex:2">${SVG_CHECK} ${t.allDone}</button>`;
  } else {
    const cnt = pc || files.length;
    html += `<button class="ab p${jp ? " jp" : ""}" onclick="convertAll()" ${files.length === 0 ? "disabled" : ""} style="flex:2">${t.convertBtn} ${cnt} ${t.convertFiles} <span style="color:#0a0a0b88">//</span> ${fi.label}</button>`;
  }

  if (dc > 1) {
    html += `<button class="ab s" onclick="downloadAllZip()" ${zipping || !libsReady.zip ? "disabled" : ""} style="flex:1">${zipping ? `<span style="animation:pu 1.5s ease-in-out infinite">${t.zipping}</span>` : SVG_ZIP + " " + t.zip}</button>`;
  } else if (dc === 1) {
    const done = files.find(f => f.status === "done");
    html += `<button class="ab s" onclick="downloadFile('${done.id}')" style="flex:1">${SVG_DL} ${t.download}</button>`;
  }

  el.innerHTML = html;
}

// ── Conversion ──
function calcResize(origW, origH) {
  if (!resizeEnabled) return { w: origW, h: origH };
  const tw = parseInt(document.getElementById("resize-w").value) || 0;
  const th = parseInt(document.getElementById("resize-h").value) || 0;
  if (!tw && !th) return { w: origW, h: origH };
  if (lockAspect) {
    const a = origW / origH;
    if (tw && th) { const r = Math.min(tw / origW, th / origH); return { w: Math.round(origW * r), h: Math.round(origH * r) }; }
    if (tw) return { w: tw, h: Math.round(tw / a) };
    if (th) return { w: Math.round(th * a), h: th };
  }
  return { w: tw || origW, h: th || origH };
}

function readAsDataURL(blob) {
  return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(blob); });
}

async function convertSingle(fi, format, q) {
  let exifData = null;
  if (!stripMeta && window.piexif) {
    const ext = getExt(fi.name);
    if (ext === "jpg" || ext === "jpeg") {
      try { const du = await readAsDataURL(fi.file); exifData = piexif.load(du); } catch {}
    }
  }
  let blob = fi.file;
  if (isHeic(fi.file)) {
    if (!window.heic2any) throw new Error("HEIC decoder not loaded");
    blob = await heic2any({ blob: fi.file, toType: "image/jpeg", quality: 0.95 });
  }
  const url = URL.createObjectURL(blob);
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      const { w, h } = calcResize(img.naturalWidth, img.naturalHeight);
      const c = document.createElement("canvas"); c.width = w; c.height = h;
      const ctx = c.getContext("2d");
      if (format === "image/jpeg") { ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, w, h); }
      ctx.drawImage(img, 0, 0, w, h);
      URL.revokeObjectURL(url);
      const useQ = ["image/jpeg","image/webp","image/avif"].includes(format) ? q / 100 : undefined;

      if (!stripMeta && exifData && format === "image/jpeg" && window.piexif) {
        try {
          const du = c.toDataURL("image/jpeg", useQ);
          const eb = piexif.dump(exifData);
          const we = piexif.insert(eb, du);
          fetch(we).then(r => r.blob()).then(resolve).catch(() => {
            c.toBlob(b => b ? resolve(b) : reject(new Error("Failed")), format, useQ);
          });
        } catch {
          c.toBlob(b => b ? resolve(b) : reject(new Error("Failed")), format, useQ);
        }
      } else {
        c.toBlob(b => b ? resolve(b) : reject(new Error("Format unsupported")), format, useQ);
      }
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("Image load failed")); };
    img.src = url;
  });
}

async function convertAll() {
  converting = true;
  renderActions();
  const pending = files.filter(f => f.status !== "done");
  for (const fi of pending) {
    fi.status = "converting";
    renderFileList();
    try {
      const blob = await convertSingle(fi, outputFormat, quality);
      fi.output = URL.createObjectURL(blob);
      fi.outputBlob = blob;
      fi.outputSize = blob.size;
      fi.status = "done";
    } catch (err) {
      fi.status = "error";
      fi.error = err.message;
    }
    renderFileList();
  }
  converting = false;
  renderActions();
}

function downloadFile(id) {
  const fi = files.find(f => f.id === id);
  if (!fi?.output) return;
  const ext = fmtInfo().ext;
  const a = document.createElement("a");
  a.href = fi.output;
  a.download = fi.name.replace(/\.[^.]+$/, "") + "." + ext;
  a.click();
}

async function downloadAllZip() {
  if (!window.JSZip) return;
  zipping = true;
  renderActions();
  try {
    const zip = new JSZip();
    const ext = fmtInfo().ext;
    const done = files.filter(f => f.status === "done" && f.outputBlob);
    const nc = {};
    for (const fi of done) {
      let bn = fi.name.replace(/\.[^.]+$/, "");
      nc[bn] = (nc[bn] || 0) + 1;
      const sfx = nc[bn] > 1 ? "_" + nc[bn] : "";
      zip.file(bn + sfx + "." + ext, fi.outputBlob);
    }
    const content = await zip.generateAsync({ type: "blob", compression: "DEFLATE", compressionOptions: { level: 6 } });
    const url = URL.createObjectURL(content);
    const a = document.createElement("a"); a.href = url; a.download = "morph_" + ext + "_" + Date.now() + ".zip"; a.click();
    setTimeout(() => URL.revokeObjectURL(url), 3000);
  } catch (e) { console.error("ZIP:", e); }
  zipping = false;
  renderActions();
}

// ── Events ──
const dz = document.getElementById("drop-zone");
const fi = document.getElementById("file-input");

dz.addEventListener("dragover", e => { e.preventDefault(); dz.classList.add("on"); });
dz.addEventListener("dragleave", () => dz.classList.remove("on"));
dz.addEventListener("drop", e => { e.preventDefault(); dz.classList.remove("on"); if (e.dataTransfer.files.length) addFiles(Array.from(e.dataTransfer.files)); });
fi.addEventListener("change", e => { if (e.target.files.length) { addFiles(Array.from(e.target.files)); e.target.value = ""; } });

document.getElementById("quality-slider").addEventListener("input", e => {
  quality = Number(e.target.value);
  document.getElementById("lbl-quality").textContent = t.quality + ": " + quality + "%";
});

// ── Init ──
loadScript("https://cdn.jsdelivr.net/npm/heic2any@0.0.4/dist/heic2any.min.js", "heic", () => !!window.heic2any);
loadScript("https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js", "zip", () => !!window.JSZip);
loadScript("https://cdn.jsdelivr.net/npm/piexifjs@1.0.6/piexif.min.js", "piexif", () => !!window.piexif);
renderUI();
</script>
